# Please note not all available settings / options are set here.
# For a full list, see the wiki
#
#env = WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
#env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
#env = AQ_DRM_DEVICES,/dev/dri/card1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
env=__GLX_VENDOR_LIBRARY_NAME=mesa
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
#env = WLR_DRM_DEVICES,/dev/dri/card0

cursor {
    no_hardware_cursors = true
#    allow_dumb_copy = true
}

source=~/.config/hypr/monitors.conf

#source=~/.config/hypr/workspaces.conf


# See https://wiki.hyprland.org/Configuring/Monitors/


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
exec-once=hyprctl setcursor Adwaita 24
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
bind = SUPER, space, exec, hyprctl switchxkblayout current next
input {
    kb_layout = it,us
#    kb_options = grp:alt_space_toggle

    kb_variant = ,dvorak
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
        scroll_factor = 0.8
    }

    sensitivity = 0.4 # -1.0 - 1.0, 0 means no modification.
    accel_profile = adaptive
}
dwindle {
#    no_gaps_when_only = 1
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 3
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
    resize_on_border = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 3
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    inactive_opacity = 0.98

#    drop_shadow = yes
#    shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)
}

group {
col.border_active = rgba(000000ff) rgba(000000ff) 45deg
col.border_inactive = rgba(000000ff) rgba(000000ff) 45deg
col.border_locked_active = rgba(FADA16ff) rgba(4DBD4Fff) 45deg
col.border_locked_inactive = rgba(5032ACff) rgba(1F5322ff) 45deg
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 4, default
    animation = borderangle, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
#    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe_touch = on
    #workspace_swipe_fingers = 4
    workspace_swipe_distance = 1003
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
#    render_ahead_of_time = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    allow_session_lock_restore = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

# Example windowrule v1
# windowrule = float 1, ^(kitty)$
# Example windowrule v2
# windowrule = float 1,match:class ^(kitty)$,match:title ^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, xfce4-terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exec, nwg-bar
bind = $mainMod, L, exec, hyprlock & bash -c 'sleep 3 && hyprctl dispatch dpms off'
bind = $mainMod, E, exec, thunar
bind = $mainMod, J, exec, joplin-desktop
bind = $mainMod, F, togglefloating, 
#bind = $mainMod, P, togglesplit, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, S, swapnext,
bind = $mainMod, T, togglegroup,
bind = $mainMod, tab, changegroupactive, f
bind = $mainMod, G, fullscreen, 1
bind = $mainMod, H, fullscreen, 0
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod CTRL, 1, workspace, 11
bind = $mainMod CTRL, 2, workspace, 12
bind = $mainMod CTRL, 3, workspace, 13
bind = $mainMod CTRL, 4, workspace, 14
bind = $mainMod CTRL, 5, workspace, 15
bind = $mainMod CTRL, 6, workspace, 16
bind = $mainMod CTRL, 7, workspace, 17
bind = $mainMod CTRL, 8, workspace, 18
bind = $mainMod CTRL, 9, workspace, 19
bind = $mainMod CTRL, 0, workspace, 20

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 11
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 12
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 13
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 14
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 15
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 16
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 17
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 18
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 19
bind = $mainMod CTRL SHIFT, 0, movetoworkspace, 20

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kwalletd5
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = wl-gammarelay
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
bind = SUPER, V, exec, cliphist list | wofi --dmenu -I | cliphist decode | wl-copy
#env = WLR_DRM_NO_ATOMIC,1
#env = WLR_NO_HARDWARE_CURSORS,1
bindr = SUPER, SUPER_L, exec, pkill wofi || wofi -I --show drun

# Screenshot keybindings
bind = SUPER ALT,   S, exec, grim
bind = SUPER SHIFT, S, exec, grim -g "$(slurp -d)"

# Volume Keybinds
#bind = , XF86AudioRaiseVolume,    exec, amixer set Master 5%+
#bind = , XF86AudioLowerVolume,    exec, amixer set Master 5%-
#bind = , XF86AudioMute,           exec, amixer set Master toggle

# Volume Keybinds
binde = , XF86AudioRaiseVolume,    exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume,    exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,           exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# brightness keybinds
binde = , XF86MonBrightnessUp,     exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown,   exec, brightnessctl set 5%-

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# toolkit-specific scale
env = GDK_SCALE,1

windowrule = opacity 0.0 override 0.0 override,match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus 1,match:class ^(xwaylandvideobridge)$
exec-once = xwaylandvideobridge

#bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
#bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
#bind = , XF86AudioMicMute, exec, pamixer --default-source -m
#bind = , XF86AudioMute, exec, pamixer -t

exec-once = hyprpaper
exec-once = blueman-applet
exec-once = udiskie
#windowrule = float 1,^(pavucontrol)$
#windowrule = float 1,^(blueman-manager)$
#windowrule = float 1,^(nm-connection-editor)$
#windowrule = float 1,^(chromium)$
#windowrule = float 1,^(thunar)$
windowrule=float 1,match:class ^(firefox)$,match:title ^(Firefox — Sharing Indicator)$
windowrule=float 1,match:class ^(firefox)$,match:title ^(Firefox – Indicatore condivisione)$
windowrule=float 1,match:title Firefox - Indicatore condivisione
#windowrule = float 1,^(nwg-displays)$
#windowrule = float 1,^(file-roller)$
#windowrule = float 1, match:title ^(btop)$
#windowrule = float 1, match:title ^(update-sys)$
windowrule = float 1,match:class ^(org.kde.polkit-kde-authentication-agent-1)$

# Example windowrule v2
# windowrule = float 1,match:class ^(kitty)$,match:title ^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# rules below would make the specific app transparent
windowrule = opacity 0.95 0.95,match:class ^(kitty)$
windowrule = animation popin 1,match:class ^(kitty)$,match:title ^(update-sys)$
windowrule = animation popin 1,match:class ^(thunar)$
windowrule = opacity 0.95 0.95,match:class ^(thunar)$
windowrule = opacity 0.95 0.95,match:class ^(VSCodium)$
windowrule = animation popin 1,match:class ^(chromium)$
windowrule = animation slide,match:class ^(wofi)$
windowrule = move 100%-433 53,match:class ^(wofi)$,match:title ^(clippick)$

bind = $mainMod, M, exec, nwg-bar

# -- Fix odd behaviors in IntelliJ IDEs --
#! Fix focus issues when dialogs are opened or closed
#windowrule = windowdance,match:class ^(jetbrains-.*)$,match:floating 1
#! Fix splash screen showing in weird places and prevent annoying focus takeovers
windowrule = center 1,match:class ^(jetbrains-.*)$,match:title ^(splash)$

#! Center popups/find windows
#! Disable window flicker when autocomplete or tooltips appear

#exec-once=wayvnc -g
exec-once=kdeconnectd
exec-once=kdeconnect-indicator
#exec-once=hyprctl plugin load /usr/share/hyprland/plugins/hyprbars.so
exec-once=libinput-gestures-setup autostart start
exec-once=mpris-proxy
exec-once=/home/dave/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox
exec-once=hypridle
exec-once=refresh-rate auto
exec-once = /usr/lib64/libexec/polkit-kde-authentication-agent-1
exec-once = gnome-keyring-daemon --replace --components=secrets
plugin {
    hyprbars {
        # example config
        bar_height = 20

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(ff4040), 10, 󰖭, hyprctl dispatch killactive
        #hyprbars-button = rgb(eeee11), 10, , hyprctl dispatch fullscreen 1
    }
}
