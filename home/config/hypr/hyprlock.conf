# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = /home/dave/Immagini/PXL_20240805_194544484.jpg
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.8
    vibrancy = 0.3
    vibrancy_darkness = 0.3
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = true
    hide_cursor = true
    grace = 1
    disable_loading_bar = true
    ignore_empty_input = true
    immediate_render = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $foreground
    placeholder_text = 
    fade_on_empty = true
    rounding = -1
    check_color = rgb(204, 136, 34)
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:5000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 120
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}


label {
    monitor =
    text = cmd[update:10000] cat /sys/devices/LNXSYSTM:00/LNXSYBUS:00/PNP0C0A:00/power_supply/BAT0/capacity
    color = $foreground
    font_size = 24
    font_family = JetBrains Mono
    position = -90, -10
    halign = right
    valign = top
}

